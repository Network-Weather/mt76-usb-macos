name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-research:
    name: Windows research / Python 3.14
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install offline test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check Python formatting and lint
        run: |
          ruff format --check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ruff check .
      - name: Check documentation
        run: python scripts/check_docs.py
      - name: Offline tests (no adapter or firmware)
        run: python -m pytest -q
      - name: Compile native WinUSB probe
        run: ./research/windows/build_probe.ps1

  lint-and-test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-26]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check formatting
        run: ruff format --check .
      - name: Lint Python
        run: ruff check .
      - name: Check local documentation links and JSON
        run: python scripts/check_docs.py
      - name: Check shell syntax
        run: bash -n setup.sh
      - name: Offline tests (no hardware, no firmware)
        run: pytest -q
      - name: Build distributable artifacts
        run: python -m build --no-isolation
      - name: Verify installed requirements
        run: python -m pip check
      - name: Build and test C driver
        run: |
          make -C c all
          make -C c test
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(python -c 'from importlib.metadata import version; print(version("mt76-usb-macos"))')" = "$GITHUB_REF_NAME"
