name: Hardware bug
description: Report a passive capture, firmware, USB, or decode problem
title: "[hardware] "
labels: [bug, hardware]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload unredacted pcaps. Remove third-party SSIDs, MAC addresses, payloads, and credentials.
  - type: input
    id: commit
    attributes:
      label: Repository commit
      placeholder: git rev-parse HEAD
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Mac and macOS build
      placeholder: M1 Max; macOS 26.6 (25G72)
    validations:
      required: true
  - type: input
    id: usb
    attributes:
      label: Adapter and USB ID
      placeholder: ALFA AWUS036AXML; 0e8d:7961; interface 3
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Firmware and setup output
      description: Include setup.sh output and firmware SHA-256 values; redact serial numbers.
    validations:
      required: true
  - type: dropdown
    id: transmit
    attributes:
      label: Did the run transmit?
      options:
        - No, passive receive only
        - Yes, inject_demo.py only
        - Yes, other transmit code
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction and actual result
      description: Include the exact command, channel, band, duration, and full traceback.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result and independent checks
      description: State what should happen and any capinfos/tshark evidence.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed third-party identifiers and did not attach an ambient pcap.
          required: true

