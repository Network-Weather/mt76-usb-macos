[project]
name = "mt7921u-macos"
version = "0.1.0"
description = "Userspace MT7921U monitor-mode driver for macOS (6 GHz capable, no kext/DriverKit/VM)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause-Clear" }
dependencies = ["pyusb>=1.2"]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
